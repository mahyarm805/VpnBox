concurrency: name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download sing-box binary
        run: |
          echo "=== Downloading sing-box v1.11.4 ==="
          
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64
          mkdir -p app/src/main/jniLibs/x86
          
          download_singbox() {
            local arch=$1
            local target_dir=$2
            local url="https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-${arch}.tar.gz"
            echo "Downloading: $url"
            curl -L -o /tmp/sing-box-${arch}.tar.gz "$url"
            mkdir -p /tmp/sing-box-extract
            tar -xzf /tmp/sing-box-${arch}.tar.gz -C /tmp/sing-box-extract --strip-components=1
            find /tmp/sing-box-extract -name "sing-box" -type f | head -1 | xargs -I{} cp {} ${target_dir}/libsing-box.so
            chmod 755 ${target_dir}/libsing-box.so
            ls -la ${target_dir}/libsing-box.so
            rm -rf /tmp/sing-box-extract /tmp/sing-box-${arch}.tar.gz
          }
          
          download_singbox "android-arm64" "app/src/main/jniLibs/arm64-v8a"
          download_singbox "android-arm" "app/src/main/jniLibs/armeabi-v7a"
          download_singbox "android-amd64" "app/src/main/jniLibs/x86_64"
          download_singbox "android-x86" "app/src/main/jniLibs/x86"
          
          echo "=== All sing-box binaries downloaded ==="
          find app/src/main/jniLibs -name "libsing-box.so" -exec ls -la {} \;

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
